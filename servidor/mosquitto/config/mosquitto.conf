# Listener MQTT en todas las interfaces (necesario para que llegue el ESP32)
listener 1883 0.0.0.0

# Provisional: sin autenticación, solo para la primera prueba
allow_anonymous true

# Persistencia de mensajes retained y sesiones
persistence true
persistence_location /mosquitto/data/

# Registro en fichero y por la salida de Docker
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
